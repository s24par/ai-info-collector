name: 不具合報告
description: 再現可能な問題を報告します。
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: 問題の概要
      description: 発生した問題を簡潔に説明してください。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 問題を再現できる最小限の手順を記載してください。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 実行環境
      description: OS、Pythonバージョン、アプリのバージョンまたはコミットを記載してください。
      placeholder: |
        - OS:
        - Python:
        - Version / commit:
  - type: checkboxes
    id: confirmation
    attributes:
      label: 確認事項
      options:
        - label: 既存のIssueに同じ問題がないことを確認しました。
          required: true